<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Auctor — The Developer Trust Score. Upload your CV, verify your skills, get a score recruiters trust.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Auctor">
  <link rel="apple-touch-icon" href="icons/Icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <!-- Open Graph -->
  <meta property="og:title" content="Auctor — Developer Trust Score" />
  <meta property="og:description" content="Upload your CV. Verify your skills. Get a score recruiters trust." />
  <meta property="og:image" content="favicon.png" />
  <meta property="og:type" content="website" />

  <meta name="theme-color" content="#000000">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">

  <title>Auctor — Developer Trust Score</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080808; }

    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #080808;
      z-index: 9999;
      transition: opacity 0.18s ease;
    }

    /* Subtle grid background */
    #loader::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.05) 1px, transparent 1px);
      background-size: 56px 56px;
      pointer-events: none;
    }

    /* Radial gold glow */
    #loader::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(201,168,76,0.09) 0%, transparent 70%);
      pointer-events: none;
    }

    #loader-inner {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center;
      gap: 0;
    }

    #loader-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #C9A84C 0%, #7A6230 100%);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 28px; font-weight: 800;
      color: #080808;
      margin-bottom: 24px;
      box-shadow: 0 0 40px rgba(201,168,76,0.25);
      animation: logoIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    #loader-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 22px; font-weight: 800;
      color: #f0ede6;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      animation: fadeUp 0.35s 0.12s ease both;
    }

    #loader-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px; font-weight: 500;
      color: #C9A84C;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 40px;
      animation: fadeUp 0.35s 0.2s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Progress bar track */
    #loader-track {
      width: 140px; height: 2px;
      background: rgba(201,168,76,0.12);
      border-radius: 2px; overflow: hidden;
      margin-bottom: 14px;
      animation: fadeUp 0.3s 0.28s ease both;
    }

    /* Progress fill — driven by JS */
    #loader-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #7A6230, #F2C94C, #C9A84C);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    #loader-status {
      font-family: 'SF Mono', 'Fira Code', monospace, sans-serif;
      font-size: 10px; font-weight: 500;
      color: rgba(201,168,76,0.55);
      letter-spacing: 0.5px;
      animation: fadeUp 0.3s 0.32s ease both;
      min-height: 14px;
    }
  </style>

  <div id="loader">
    <div id="loader-inner">
      <div id="loader-logo">A</div>
      <div id="loader-title">Auctor</div>
      <div id="loader-sub">Developer Trust Score</div>
      <div id="loader-track"><div id="loader-fill"></div></div>
      <div id="loader-status">Initialising…</div>
    </div>
  </div>

  <script>
    (function() {
      var fill = document.getElementById('loader-fill');
      var status = document.getElementById('loader-status');

      // Progress stages — simulate realistic Flutter web load phases
      var stages = [
        [0,    0,   'Initialising…'],
        [200,  12,  'Loading engine…'],
        [600,  28,  'Compiling…'],
        [1200, 48,  'Preparing UI…'],
        [2000, 62,  'Almost ready…'],
        [3000, 75,  'Almost ready…'],
        [4500, 85,  'Almost ready…'],
        [7000, 92,  'Almost ready…'],
      ];

      stages.forEach(function(s) {
        setTimeout(function() {
          if (fill) fill.style.width = s[1] + '%';
          if (status) status.textContent = s[2];
        }, s[0]);
      });

      // Flutter signals first frame painted → instantly remove loader
      window.addEventListener('flutter-first-frame', function() {
        var loader = document.getElementById('loader');
        if (!loader) return;
        if (fill) fill.style.width = '100%';
        // 80ms grace so the fill reaches 100% visually, then fade out
        setTimeout(function() {
          loader.style.opacity = '0';
          setTimeout(function() { loader.remove(); }, 180);
        }, 80);
      });

      // Hard fallback — remove after 15 s regardless
      setTimeout(function() {
        var loader = document.getElementById('loader');
        if (loader) loader.remove();
      }, 15000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
