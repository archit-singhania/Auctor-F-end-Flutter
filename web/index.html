<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Auctor — The Developer Trust Score. Upload your CV, verify your skills, get a score recruiters trust.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Auctor">
  <link rel="apple-touch-icon" href="icons/Icon.png">

  <!-- Favicon — ?v=2 busts any CDN/browser cache of the old icon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <!-- Open Graph (looks good when shared on WhatsApp / LinkedIn) -->
  <meta property="og:title" content="Auctor — Developer Trust Score" />
  <meta property="og:description" content="Upload your CV. Verify your skills. Get a score recruiters trust." />
  <meta property="og:image" content="favicon.png" />
  <meta property="og:type" content="website" />

  <meta name="theme-color" content="#000000">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">

  <title>Auctor — Developer Trust Score</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    body { margin: 0; background: #080808; }
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #080808;
      z-index: 9999;
      /* No fade-in delay — show instantly */
    }
    #loader-logo {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #C9A84C, #7A6230);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, sans-serif; font-size: 24px; font-weight: 800;
      color: #080808;
      margin-bottom: 28px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(0.93); }
    }
    #loader-bar-wrap {
      width: 100px; height: 2px;
      background: rgba(201,168,76,0.15);
      border-radius: 2px; overflow: hidden;
    }
    #loader-bar {
      height: 100%; width: 35%;
      background: linear-gradient(90deg, #7A6230, #F2C94C);
      border-radius: 2px;
      animation: slide 1.0s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(390%); }
    }
  </style>
  <div id="loader">
    <div id="loader-logo">A</div>
    <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
  </div>
  <script>
    // Remove loader once Flutter signals it's ready — fast fade
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.style.transition = 'opacity 0.2s ease';
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 200);
      }
    });
    // Safety fallback — remove after 12s regardless
    setTimeout(function() {
      var loader = document.getElementById('loader');
      if (loader) loader.remove();
    }, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
