name: Flutter verification
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/production-config.test.cjs
      - run: bash -n scripts/vercel-install.sh scripts/vercel-build.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=https://example.invalid --dart-define=WEB_BASE_URL=https://example.invalid
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://example.invalid
